<style>
/* Layout: field inspection sheet — question cards left, sticky live result panel right; stacks on phones */
:root{
  --bg:#F2F4F6; --paper:#FFFFFF; --ink:#16263B; --muted:#5A6676; --rule:#D3D9E0;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151F; --paper:#16202D; --ink:#E6ECF3; --muted:#9AA7B7; --rule:#2B3747;
  --accent:#E3A73C; --accent-ink:#F5D79E; --ok:#5DBB86; --warn:#E89A4C; --crit:#EF6A62; --sel:#22324A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151F; --paper:#16202D; --ink:#E6ECF3; --muted:#9AA7B7; --rule:#2B3747;
  --accent:#E3A73C; --accent-ink:#F5D79E; --ok:#5DBB86; --warn:#E89A4C; --crit:#EF6A62; --sel:#22324A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.brand{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1;margin:4px 0 6px;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch}
.lang{display:flex;gap:4px}
.lang button,.btn{font:600 14px var(--f-body);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible,.lang button:focus-visible,.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-bottom:12px}
.qh{display:flex;gap:12px;align-items:baseline}
.qn{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-width:2.2em}
.qt{font-weight:700;font-size:17px}
.qd{color:var(--muted);font-size:14px;margin:4px 0 10px 3.1em}
.opts{display:flex;flex-direction:column;gap:6px;margin-left:3.1em}
@media (max-width:520px){.qd,.opts{margin-left:0}}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;border:1px solid var(--rule);border-radius:6px;padding:8px 12px;font-size:15px}
.opt input:checked+span{background:var(--sel);border-color:var(--ink);font-weight:600}
.opt:hover span{border-color:var(--muted)}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){aside{position:static}}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:18px}
.plabel{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.verdict{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;margin:6px 0 4px}
.meter{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--ok),var(--warn),var(--crit));position:relative;margin:14px 0 6px}
.pin{position:absolute;top:-5px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-2px);transition:left .4s}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.prog{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.find{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.find li{border-left:4px solid var(--warn);padding:4px 0 4px 10px;font-size:14px}
.find li.crit{border-color:var(--crit)}
.find b{display:block;font-size:14px}
.next{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:14px}
.next h3{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.cta{margin-top:14px;background:var(--ink);color:var(--paper);border-radius:8px;padding:14px 16px;font-size:14px}
.cta b{color:var(--accent)}
.disc{margin-top:14px;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font:600 12px var(--f-mono);padding:2px 8px;border-radius:999px;color:var(--paper)}
.pro{background:var(--paper);border:2px dashed var(--accent);border-radius:8px;padding:16px 18px;margin-top:18px}
.pro h2{font-family:var(--f-display);font-size:26px;margin:0 0 4px}
.pro label.f{display:block;font-weight:600;font-size:14px;margin-top:10px}
.pro input[type=text],.pro input[type=number],.pro textarea{width:100%;font:15px var(--f-body);padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row2{grid-template-columns:1fr}}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--rule)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.msg{font-size:14px;margin-top:8px;color:var(--crit)}
#report{display:none}
@media print{
  body{background:#fff!important;color:#000}
  .wrap{display:none!important}
  #report{display:block!important;font-family:var(--f-body);color:#000;padding:0 8mm}
  #report h1{font-family:var(--f-display);font-size:28pt;margin:0}
  #report table{width:100%;border-collapse:collapse;font-size:10pt}
  #report td,#report th{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
  #report .ph{display:flex;flex-wrap:wrap;gap:6px}#report .ph img{width:56mm;height:42mm;object-fit:cover;border:1px solid #888}
  #report .sec{page-break-inside:avoid;margin-top:8mm}
  @page{size:A4;margin:14mm 10mm 16mm;@bottom-right{content:"Sayfa " counter(page);font-size:8pt}}
}
</style>

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t.trim().toUpperCase()));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}

function render(){
  const t = L[lang];
  document.documentElement.lang = lang;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-lede").textContent = t.lede;
  document.getElementById("b-sample").textContent = t.sample;
  document.getElementById("b-reset").textContent = t.reset;
  document.getElementById("t-result").textContent = t.result;
  document.getElementById("cta").innerHTML = t.cta;
  document.getElementById("disc").textContent = t.disc;
  ["s1","s2","s3"].forEach((id,i)=>document.getElementById(id).textContent=t.s[i]);
  document.getElementById("l-tr").setAttribute("aria-pressed", lang==="tr");
  document.getElementById("l-en").setAttribute("aria-pressed", lang==="en");
  [["p-h","pH"],["p-lede","pLede"],["lb-addr","addr"],["lb-name","name"],["lb-year","year"],["lb-floors","floors"],["lb-notes","notes"],["lb-photos","photos"],["lb-code","code"],["p-make","make"]].forEach(([id,k])=>document.getElementById(id).textContent=t[k]);
  const f = document.getElementById("qs"); f.innerHTML = "";
  Q.forEach((q,i)=>{
    const box = document.createElement("fieldset"); box.className="q"; box.style.border="1px solid var(--rule)";
    const opts = q.o.map((o,j)=>`<label class="opt"><input type="radio" id="q${i}o${j}" name="q${i}" value="${j}" ${ans[i]===j?"checked":""}><span>${lang==="tr"?o[0]:o[1]}</span></label>`).join("")
      + `<label class="opt"><input type="radio" id="q${i}u" name="q${i}" value="u" ${ans[i]==="u"?"checked":""}><span>${t.unk}</span></label>`;
    box.innerHTML = `<legend class="qh" style="padding:0"><span class="qn">${String(i+1).padStart(2,"0")}</span><span class="qt">${q[lang]}</span></legend>`
      + (q.d?`<div class="qd">${q.d[lang]}</div>`:`<div style="height:8px"></div>`) + `<div class="opts">${opts}</div>`;
    f.appendChild(box);
  });
  score();
}

function score(){
  const t = L[lang];
  let pts=0, n=0, crit=false; const flags=[];
  Q.forEach((q,i)=>{
    const a = ans[i]; if(a===undefined) return; n++;
    if(a==="u"){ pts+=UNK; flags.push({q:q[lang],a:t.unk,c:false}); return; }
    const o=q.o[a]; pts+=o[2];
    if(o[3]) crit=true;
    if(o[2]>=2) flags.push({q:q[lang],a:lang==="tr"?o[0]:o[1],c:!!o[3]});
  });
  const pct = Math.min(100, Math.round(pts/ (MAX*0.55) *100));
  let lv = pct<30?0:pct<60?1:2; if(crit) lv=2;
  const v=document.getElementById("verdict"), sub=document.getElementById("vsub"), pin=document.getElementById("pin");
  document.getElementById("prog").textContent = t.prog(n,Q.length);
  if(n===0){ v.textContent=t.empty; v.style.color="var(--muted)"; v.style.fontSize="24px"; sub.textContent=t.emptySub; pin.style.left="0%";
    document.getElementById("find").innerHTML=""; document.getElementById("next").innerHTML=""; return; }
  v.style.fontSize=""; v.textContent=t.lv[lv]; v.style.color=["var(--ok)","var(--warn)","var(--crit)"][lv];
  sub.textContent=t.sub[lv];
  pin.style.left = (crit?Math.max(pct,75):pct)+"%";
  flags.sort((a,b)=>b.c-a.c); LAST={lv,flags,n};
  document.getElementById("find").innerHTML = flags.slice(0,6).map(f=>`<li class="${f.c?"crit":""}"><b>${f.q}</b>${f.a}</li>`).join("");
  document.getElementById("next").innerHTML = `<h3>${t.nextH}</h3>${t.next[lv]}`;
}

document.getElementById("qs").addEventListener("change",e=>{
  const m = e.target.name.match(/^q(\d+)$/); if(!m) return;
  ans[+m[1]] = e.target.value==="u"?"u":+e.target.value; score();
});
function setLang(l){ lang=l; try{localStorage.setItem("tp-lang",l)}catch(e){} render(); }
document.getElementById("l-tr").onclick=()=>setLang("tr");
document.getElementById("l-en").onclick=()=>setLang("en");
document.getElementById("b-reset").onclick=()=>{ for(const k in ans) delete ans[k]; render(); };
document.getElementById("b-sample").onclick=()=>{ [3,2,1,2,1,1,1,0,1,2,0,1,1,0].forEach((v,i)=>ans[i]=v); render(); };
document.getElementById("p-photos").addEventListener("change",e=>{
  const files=[...e.target.files].slice(0,8-PHOTOS.length);
  files.forEach(fl=>{const r=new FileReader();r.onload=()=>{PHOTOS.push(r.result);drawThumbs()};r.readAsDataURL(fl)});
});
function drawThumbs(){document.getElementById("thumbs").innerHTML=PHOTOS.map(p=>`<img src="${p}" alt="">`).join("")}
function esc(x){return String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.getElementById("p-make").onclick=async()=>{
  const t=L[lang], msg=document.getElementById("p-msg"); msg.textContent="";
  if(!LAST||LAST.n<10){msg.textContent=t.need;return}
  const h=await sha(document.getElementById("p-code").value||"");
  if(!CODE_HASHES.includes(h)){msg.textContent=t.bad;return}
  const v=id=>esc(document.getElementById(id).value);
  const rows=Q.map((q,i)=>{const a=ans[i];const txt=a===undefined?"–":a==="u"?t.unk:(lang==="tr"?q.o[a][0]:q.o[a][1]);return `<tr><td>${i+1}. ${q[lang]}</td><td>${esc(txt)}</td></tr>`}).join("");
  const d=new Date().toLocaleDateString(lang==="tr"?"tr-TR":"en-GB");
  document.getElementById("report").innerHTML=`
   <div style="font:600 9pt var(--f-mono);letter-spacing:.12em;color:#8a5a0a">TREMORPROOF</div>
   <h1>${t.rTitle}</h1>
   <table style="margin-top:4mm"><tr><th>${t.addr}</th><td>${v("p-addr")}</td><th>${t.rDate}</th><td>${d}</td></tr>
   <tr><th>${t.year}</th><td>${v("p-year")}</td><th>${t.floors}</th><td>${v("p-floors")}</td></tr>
   <tr><th>${t.name}</th><td colspan="3">${v("p-name")}</td></tr></table>
   <div class="sec"><h2>${t.lv[LAST.lv]}</h2><p>${t.sub[LAST.lv]}</p></div>
   <div class="sec"><h3>${t.rFind}</h3><ul>${LAST.flags.map(f=>`<li><b>${esc(f.q)}:</b> ${esc(f.a)}${f.c?" ●":""}</li>`).join("")||"<li>–</li>"}</ul></div>
   <div class="sec"><h3>${t.rNext}</h3><p>${t.next[LAST.lv]}</p></div>
   <div class="sec"><h3>${t.rAsk}</h3><ol>${t.ask.map(a=>`<li>${a}</li>`).join("")}</ol></div>
   <div class="sec"><h3>${t.rAnswers}</h3><table><tr><th>${t.rQ}</th><th>${t.rA}</th></tr>${rows}</table></div>
   ${v("p-notes")?`<div class="sec"><h3>${t.rNotes}</h3><p style="white-space:pre-wrap">${v("p-notes")}</p></div>`:""}
   ${PHOTOS.length?`<div class="sec"><h3>${t.rPhotos}</h3><div class="ph">${PHOTOS.map(p=>`<img src="${p}">`).join("")}</div></div>`:""}
   <p style="font-size:8pt;color:#555;margin-top:8mm">${t.disc}</p>`;
  window.print();
};
render();
</script>
