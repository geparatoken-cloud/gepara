<head>

<style>
:root{
  --bg:#F5F1E6; --paper:#FBF9F3; --ink:#152238; --muted:#4F5B6C; --rule:#D8D0BC;
  --navy:#12284A; --gold:#A8812C; --gold-soft:#C9A24A; --on-navy:#F5EFE0;
  --ok:#2C6B3F; --ok-soft:#E3EFE5; --bad:#A3392D; --bad-soft:#F6E4E1; --info-soft:#E9EEF6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --paper:#142035; --ink:#EDE7D8; --muted:#A9B2C0; --rule:#2A3955;
  --navy:#0A1424; --gold:#D3AE5C; --gold-soft:#C9A24A; --on-navy:#F5EFE0;
  --ok:#7CC48F; --ok-soft:#173326; --bad:#E58B7E; --bad-soft:#3A1E1B; --info-soft:#1B2A44;}}
:root[data-theme="dark"]{
  --bg:#0E1726; --paper:#142035; --ink:#EDE7D8; --muted:#A9B2C0; --rule:#2A3955;
  --navy:#0A1424; --gold:#D3AE5C; --on-navy:#F5EFE0;
  --ok:#7CC48F; --ok-soft:#173326; --bad:#E58B7E; --bad-soft:#3A1E1B; --info-soft:#1B2A44;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:var(--on-navy)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{font:700 1.25rem Cinzel,serif;letter-spacing:.08em;color:var(--on-navy);text-decoration:none}
.brand small{display:block;font:600 .62rem "Source Sans 3",sans-serif;letter-spacing:.28em;color:var(--gold-soft)}
.langsel{background:transparent;color:var(--on-navy);border:1px solid #ffffff55;border-radius:6px;padding:6px 8px;font:inherit;font-size:.9rem}.langsel option{color:#152238}
.langs button{background:none;border:1px solid #ffffff33;color:var(--on-navy);border-radius:4px;padding:4px 9px;font-family:inherit;font-weight:600;font-size:.8rem;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold-soft);color:#12284A;border-color:var(--gold-soft)}
.hero{background:var(--navy);color:var(--on-navy);padding:28px 0 44px}
.hero h1{font:700 clamp(1.7rem,4.5vw,2.6rem)/1.15 Cinzel,serif;margin:0 0 12px}
.hero p{margin:0;max-width:640px;color:#D9D3C4;font-size:1.08rem}
.tabs{display:flex;gap:8px;margin:-22px auto 0;position:relative}
.tabs button{flex:1;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:8px 8px 0 0;padding:14px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.tabs button[aria-selected="true"]{border-bottom-color:var(--paper);box-shadow:inset 0 3px 0 var(--gold)}
.panel{background:var(--paper);border:1px solid var(--rule);border-top:0;border-radius:0 0 8px 8px;padding:22px}
.drop{display:block;border:2px dashed var(--rule);border-radius:10px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.on{border-color:var(--gold)}
.drop strong{display:block;font-size:1.15rem;margin-bottom:4px}
.drop span{color:var(--muted);font-size:.95rem}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.list{display:grid;gap:12px;margin-top:18px}
.item{border:1px solid var(--rule);border-radius:8px;padding:14px;background:var(--paper)}
.item h3{margin:0 0 4px;font-size:1.02rem;word-break:break-all}
.hash{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-all}
.st{margin-top:8px;font-weight:600}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}.st.wait{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-block;background:var(--navy);color:var(--on-navy);border:0;border-radius:6px;padding:10px 16px;font-family:inherit;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.res{border-radius:8px;padding:14px;margin-top:12px}
.res.ok{background:var(--ok-soft)}.res.bad{background:var(--bad-soft)}.res.info{background:var(--info-soft)}
.res b{display:block;margin-bottom:2px}
section.info{padding:40px 0}
section.info h2{font:700 1.4rem Cinzel,serif;margin:0 0 14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px;counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold-soft);color:#12284A;font-weight:700;margin-bottom:8px}
.steps h3{margin:0 0 4px;font-size:1.02rem}.steps p{margin:0;color:var(--muted);font-size:.95rem}
details{border-bottom:1px solid var(--rule);padding:12px 0}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--muted)}
.note{font-size:.9rem;color:var(--muted)}
footer{border-top:1px solid var(--rule);padding:24px 0 40px;color:var(--muted);font-size:.9rem}
@media (max-width:640px){.steps{grid-template-columns:1fr}.tabs button{padding:12px 6px;font-size:.92rem}}
@media print{header,.hero,.tabs,.drop,section.info,footer,.row{display:none!important}.panel{border:0}}
.cam{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--gold-soft);color:#12284A;border:0;border-radius:12px;padding:22px 16px;font:700 1.25rem "Source Sans 3",sans-serif;cursor:pointer;margin-bottom:12px;text-align:center}
.cam svg{flex:none}
.or{text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 0;padding:0;list-style:none}
.trust li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;font-size:.92rem}
.trust b{display:block;font-size:.98rem;margin-bottom:2px}
.live{margin-top:14px;font-size:.95rem;color:#D9D3C4}.live b{color:var(--gold-soft);font-size:1.1rem}
@media (max-width:640px){.trust{grid-template-columns:1fr 1fr}}
</style>
</head>

ackNo": "Dieses Foto ist NICHT im Paket oder wurde verändert", "chkPackOts": "Der Paketbeweis (.ots) gehört zu dieser Paketliste.", "h1": "Beweisen Sie, dass die Datei an diesem Tag bei Ihnen war", "lead": "Kostenlos. Ohne Konto. Ihre Datei verlässt Ihren Computer nicht; nur ihr digitaler Fingerabdruck geht an öffentliche Zeitstempel-Server und wird binnen weniger Stunden in der Bitcoin-Blockchain verankert.", "tabGet": "Beweis erstellen", "tabCheck": "Prüfen", "dropGet": "Dateien hier ablegen oder klicken", "dropSub": "Fotos, Videos, Verträge, Werke, Arbeiten… jede Datei. Mehrere möglich.", "dropCheck": "Datei und ggf. ihren .ots-Beweis ablegen", "dropCheckSub": "Beide können zusammen gewählt werden.", "fp": "Fingerabdruck", "working": "Fingerabdruck wird berechnet…", "sending": "Wird an Zeitstempel-Server gesendet…", "done": "Beweis fertig. Laden Sie die Beweisdatei herunter und bewahren Sie sie beim Original auf.", "fail": "Server nicht erreichbar. Verbindung prüfen und erneut versuchen.", "dl": "Beweisdatei herunterladen (.ots)", "print": "Beweisblatt drucken", "date": "Erfasst", "cals": "Server haben angenommen", "chkFile": "Datei", "chkOtsOk": "Dieser .ots-Beweis gehört zu dieser Datei.", "chkOtsBad": "Dieser .ots-Beweis gehört NICHT zu dieser Datei. Die Datei wurde möglicherweise verändert.", "chkOtsMore": "Die Bitcoin-Bestätigung können Sie unabhängig auf opentimestamps.org prüfen.", "chkReg": "Im GEPARA-Sachverständigenregister erfasst", "chkRegNo": "Kein Eintrag im GEPARA-Sachverständigenregister.", "chkNoOts": "Sie haben keinen .ots-Beweis gewählt. Falls vorhanden, wählen Sie ihn mit aus.", "chkErr": "Blockchain nicht erreichbar, bitte später erneut versuchen.", "howH": "So funktioniert es", "s1h": "Datei wählen", "s1p": "Die Datei bleibt auf Ihrem Computer. Ihr Browser berechnet ihren eindeutigen Fingerabdruck.", "s2h": "Fingerabdruck wird erfasst", "s2p": "Nur der Fingerabdruck geht an unabhängige Zeitstempel-Server und wird in Bitcoin verankert.", "s3h": "Beweis aufbewahren", "s3p": "Bewahren Sie die .ots-Datei beim Original auf. Jeder kann sie bei Bedarf prüfen.", "faqH": "Fragen", "q1": "Wird meine Datei hochgeladen?", "a1": "Nein. Nur ein 64-stelliger Fingerabdruck wird gesendet; daraus lässt sich der Inhalt nicht wiederherstellen.", "q2": "Was zeigt der Beweis?", "a2": "Dass die Datei zum Zeitpunkt der Verankerung existierte und sich seitdem nicht verändert hat. Wem sie gehört, beweist er allein nicht.", "q3": "Gilt das vor Gericht?", "a3": "Es ist keine notarielle Beglaubigung und kein qualifizierter Zeitstempel. In vielen Ländern kann er als Beweismittel vorgelegt werden; die Würdigung obliegt dem Gericht. Für einen rechtlich zwingenden Nachweis nutzen Sie einen qualifizierten Zeitstempel oder einen Notar.", "q4": "Und wenn ich die Beweisdatei verliere?", "a4": "Sie können die Datei erneut erfassen, der neue Beweis zeigt dann das neue Datum. Bewahren Sie die .ots-Datei beim Original auf.", "q5": "Kostet es etwas?", "a5": "Nein. Erstellen und Prüfen ist kostenlos. Die Verankerung erfolgt über die Open-Source-Server von OpenTimestamps.", "foot": "Dateibeweis ist ein kostenloser Dienst des GEPARA-Projekts. Keine Rechtsberatung. Verankerung in Bitcoin über OpenTimestamps. Kontakt: geparatoken@gmail.com", "guidesH": "Ratgeber (Englisch)", "camBtn": "Take a photo and prove it", "orFile": "or choose a file from your computer or phone", "tr1h": "Your file stays with you", "tr1p": "Nothing is uploaded; only a fingerprint is sent.", "tr2h": "Anchored in Bitcoin", "tr2p": "A global record no one can delete or alter.", "tr3h": "Independently verifiable", "tr3p": "No need to trust us; anyone can check at opentimestamps.org.", "tr4h": "Free, no ads", "tr4p": "No account, no card, no personal data.", "liveTxt": "documents recorded on the blockchain", "transp": "Transparency: who, how, which records"}, "es": {"tabPack": "Paquete de entrega", "packIntro": "Reúne en un solo paquete de prueba las fotos que tomas al entregar un piso, un coche o un objeto. En disputas por fianzas o daños, demuestra que las fotos se tomaron ese día y no se han cambiado desde entonces.", "dropPack": "Elige fotos o hazlas con el móvil", "dropPackSub": "Las fotos se quedan en tu móvil; solo se registran sus huellas digitales.", "packNote": "Nota (opcional, p. ej. \"Entrega del piso 5, 1 de nov.\")", "packMake": "Crear paquete de prueba", "packFiles": "archivos seleccionados", "packDone": "Paquete listo. Guarda los dos archivos junto con las fotos y compártelos con la otra parte.", "packDl1": "Descargar lista del paquete (.json)", "packDl2": "Descargar prueba del paquete (.ots)", "chkPackOk": "Esta foto está en el paquete de prueba", "chkPackNo": "Esta foto NO está en el paquete de prueba o ha sido modificada", "chkPackOts": "La prueba del paquete (.ots) corresponde a esta lista.", "h1": "Demuestra que el archivo era tuyo en esa fecha", "lead": "Gratis. Sin cuenta. Tu archivo nunca sale de tu ordenador; solo su huella digital se envía a servidores públicos de sellado de tiempo y queda registrada en la blockchain de Bitcoin en pocas horas.", "tabGet": "Obtener prueba", "tabCheck": "Comprobar", "dropGet": "Suelta archivos aquí o haz clic para elegir", "dropSub": "Fotos, vídeos, contratos, obras, tesis… cualquier archivo. Puedes elegir varios.", "dropCheck": "Suelta el archivo que quieres comprobar y su prueba .ots, si la tienes", "dropCheckSub": "Puedes seleccionar ambos a la vez.", "fp": "Huella digital", "working": "Calculando la huella digital…", "sending": "Enviando a los servidores de sellado de tiempo…", "done": "Prueba lista. Descarga el archivo de prueba y guárdalo junto al original.", "fail": "No se pudo conectar con los servidores. Revisa tu conexión e inténtalo de nuevo.", "dl": "Descargar archivo de prueba (.ots)", "print": "Imprimir hoja de prueba", "date": "Registrado", "cals": "servidores lo aceptaron", "chkFile": "Archivo", "chkOtsOk": "Esta prueba .ots corresponde a este archivo.", "chkOtsBad": l'original. N'importe qui peut le vérifier en cas de besoin.", "faqH": "Questions", "q1": "Mon fichier est-il envoyé en ligne ?", "a1": "Non. Le fichier lui-même n'est jamais envoyé. Seule une empreinte de 64 caractères est transmise ; elle ne permet pas de retrouver le contenu.", "q2": "Que prouve la preuve ?", "a2": "Que le fichier existait au moment de l'ancrage et qu'aucune lettre n'a changé depuis. À elle seule, elle ne prouve pas à qui appartient le fichier.", "q3": "Est-ce valable devant un tribunal ?", "a3": "Ce n'est ni un acte notarié ni un horodatage légal qualifié. Dans de nombreux pays, elle peut être produite comme élément de preuve ; c'est le tribunal qui en apprécie la valeur. Pour une preuve juridique irréfutable, utilisez un horodatage qualifié ou un notaire.", "q4": "Et si je perds le fichier de preuve ?", "a4": "Vous pouvez enregistrer à nouveau le même fichier, mais la nouvelle preuve portera la nouvelle date. Gardez le fichier .ots avec l'original.", "q5": "Est-ce gratuit ?", "a5": "Oui. Obtenir et vérifier des preuves est gratuit. Les enregistrements sont ancrés dans Bitcoin via les serveurs open source d'OpenTimestamps.", "foot": "Preuve de Fichier est un service gratuit du projet GEPARA. Ceci n'est pas un conseil juridique. Les enregistrements sont ancrés dans la blockchain Bitcoin via OpenTimestamps. Contact : geparatoken@gmail.com", "guidesH": "Guides (en anglais)", "camBtn": "Take a photo and prove it", "orFile": "or choose a file from your computer or phone", "tr1h": "Your file stays with you", "tr1p": "Nothing is uploaded; only a fingerprint is sent.", "tr2h": "Anchored in Bitcoin", "tr2p": "A global record no one can delete or alter.", "tr3h": "Independently verifiable", "tr3p": "No need to trust us; anyone can check at opentimestamps.org.", "tr4h": "Free, no ads", "tr4p": "No account, no card, no personal data.", "liveTxt": "documents recorded on the blockchain", "transp": "Transparency: who, how, which records"}, "pt": {"tabPack": "Pacote de entrega", "packIntro": "Junte em um único pacote de prova as fotos que você tira ao entregar um imóvel, um carro ou um objeto. Em disputas sobre caução ou danos, ele mostra que as fotos foram tiradas naquele dia e não foram alteradas desde então.", "dropPack": "Escolha fotos ou tire com o celular", "dropPackSub": "As fotos ficam no seu celular; só as impressões digitais delas são registradas.", "packNote": "Observação (opcional, ex.: \"Entrega do apto 5, 1º nov.\")", "packMake": "Criar pacote de prova", "packFiles": "arquivos selecionados", "packDone": "Pacote pronto. Guarde os dois arquivos junto com as fotos e compartilhe com a outra parte.", "packDl1": "Baixar lista do pacote (.json)", "packDl2": "Baixar prova do pacote (.ots)", "chkPackOk": "Esta foto está no pacote de prova", "chkPackNo": "Esta foto NÃO está no pacote de prova ou foi alterada", "chkPackOts": "A prova do pacote (.ots) pertence a esta lista.", "h1": "Prove que o arquivo era seu naquela data", "lead": "Grátis. Sem cadastro. Seu arquivo nunca sai do seu computador; só a impressão digital dele é enviada a servidores públicos de carimbo de tempo e registrada na blockchain do Bitcoin em poucas horas.", "tabGet": "Obter prova", "tabCheck": "Verificar", "dropGet": "Solte os arquivos aqui ou clique para escolher", "dropSub": "Fotos, vídeos, contratos, obras, teses… qualquer arquivo. Você pode escolher vários.", "dropCheck": "Solte o arquivo a verificar e a prova .ots dele, se tiver", "dropCheckSub": "Você pode selecionar os dois juntos.", "fp": "Impressão digital", "working": "Calculando a impressão digital…", "sending": "Enviando aos servidores de carimbo de tempo…", "done": "Prova pronta. Baixe o arquivo de prova e guarde junto com o original.", "fail": "Não foi possível acessar os servidores. Verifique sua conexão e tente de novo.", "dl": "Baixar arquivo de prova (.ots)", "print": "Imprimir folha de prova", "date": "Registrado", "cals": "servidores aceitaram", "chkFile": "Arquivo", "chkOtsOk": "Esta prova .ots pertence a este arquivo.", "chkOtsBad": "Esta prova .ots NÃO pertence a este arquivo. O arquivo pode ter sido alterado.", "chkOtsMore": "Para conferir a confirmação no Bitcoin por conta própria, verifique o arquivo e a prova .ots em opentimestamps.org.", "chkReg": "Registrado no cadastro de peritos GEPARA", "chkRegNo": "Nenhum registro no cadastro de peritos GEPARA.", "chkNoOts": "Você não selecionou uma prova .ots para este arquivo. Se tiver uma, selecione também.", "chkErr": "Não foi possível acessar a blockchain. Tente de novo daqui a pouco.", "howH": "Como funciona", "s1h": "Escolha o arquivo", "s1p": "Seu arquivo fica no seu computador. Seu navegador calcula a impressão digital única dele.", "s2h": "A impressão digital é registrada", "s2p": "Só a impressão digital vai para servidores independentes de carimbo de tempo e é registrada na blockchain do Bitcoin.", "s3h": "Guarde a prova", "s3p": "Guarde o arquivo .ots baixado junto com o original. Qualquer pessoa pode verificá-lo quando precisar.", "faqH": "Perguntas", "q1": "Meu arquivo é enviado?", "a1": "Não. O arquivo em si nunca é enviado para lugar nenhum. Só é enviada uma impressão digital de 64 caracteres; não dá para recuperar o conteúdo a partir dela.", "q2": "O que a prova mostra?", "a2": "Que o arquivo existia quando o registro foi feito e que nem uma letra mudou desde então. Sozinha, ela não prova quem é o dono do arquivo.", "q3": "Vale na Justiça?", "a3": "Não é um reconhecimento em cartório nem um carimbo de tempo legal qualificado. Em muitos países, pode ser apresentada como prova; o tribunal decide o peso dela. Para uma prova jurídica conclusiva, use um carimbo de tempo qualificado ou um cartório.", "q4": "E se eu perder o arquivo de prova?", "a4": "Você pode registrar o mesmo arquivo de novo, mas a nova prova mostrará a nova data. Guarde o arquivo .ots junto com o original.", "q5": "É grátis?", "a5": "Sim. Obter e verificar provas é grátis. Os registros são ancorados no Bitcoin pelos servidores de código aberto do OpenTimestamps.", "foot": "Prova de Arquivo é um serviço gratuito do projeto GEPARA. Não é aconselhamento jurídico. Os registros são ancorados na blockchain do Bitcoin via OpenTimestamps. Contato: geparatoken@gmail.com", "guidesH": "Guias (em inglês)", "camBtn": "Take a photo and prove it", "orFile": "or choose a file from your computer or phone", "tr1h": "Your file stays with you", "tr1p": "Nothing is uploaded; only a fingerprint is sent.", "tr2h": "Anchored in Bitcoin", "tr2p": "A global record no one can delete or alter.", "tr3h": "Independently verifiable", "tr3p": "No need to trust us; anyone can check at opentimestamps.org.", "tr4h": "Free, no ads", "tr4p": "No account, no card, no personal data.", "liveTxt": "documents recorded on the blockchain", "transp": "Transparency: who, how, which records"}, "ru": {"tabPack": "Пакет передачи", "packIntro": "Соберите в один пакет доказательств фотографии, сделанные при передаче квартиры, машины или вещи. В спорах о залоге или повреждениях он показывает, что фото сделаны в тот день и с тех пор не менялись.", "dropPack": "Выберите фото или снимите их телефоном", "dropPackSub": "Фото остаются на вашем телефоне; записываются только их отпечатки.", "packNote": "Заметка (необязательно, напр. \"Передача кв. 5, 1 нояб.\")", "packMake": "Создать пакет доказательств", "packFiles": "файлов выбрано", "packDone": "Пакет готов. Храните оба файла вместе с фото и передайте их другой стороне.", "packDl1": "Скачать список пакета (.json)", "packDl2": "Скачать доказательство пакета (.ots)", "chkPackOk": "Это фото есть в пакете доказательств", "chkPackNo": "Этого фото НЕТ в пакете доказательств, или оно было изменено", "chkPackOts": "Доказательство пакета (.ots) относится к этому списку.", "h1": "Докажите, что файл был у вас в эту дату", "lead": "Бесплатно. Без регистрации. Ваш файл не покидает компьютер; на публичные серверы меток времени отправляется только его цифровой отпечаток, и в течение нескольких часов он закрепляется в блокчейне Bitcoin.", "tabGet": "Получить доказательство", "tabCheck": "Проверить", "dropGet": "Перетащите файлы сюда или нажмите, чтобы выбрать", "dropSub": "Фото, видео, договоры, работы, диссертации… любой файл. Можно выбрать несколько.", "dropCheck": "Перетащите файл для проверки и его доказательство .ots, если оно есть", "dropCheckSub": "Можно выбрать оба сразу.", "fp": "Отпечаток", "working": "Вычисляем отпечаток…", "sending": "Отправляем на серверы меток времени…", "done": "Доказательство готово. Скачайте файл доказательства и храните его рядом с оригиналом.", "fail": "Не удалось связаться с серверами. Проверьте подключение и попробуйте снова.", "dl": "Скачать файл доказательства (.ots)", "print": "Распечатать лист доказательства", "date": "Записано", "cals": "серверов приняли", "chkFile": "Файл", "chkOtsOk": "Это доказательство .ots относится к этому файлу.", "chkOtsBad": "Это доказательство .ots НЕ относится к этому файлу. Возможно, файл был изменён.", "chkOtsMore": "Чтобы самостоятельно проверить подтверждение в Bitcoin, проверьте файл и его доказательство .ots на opentimestamps.org.", "chkReg": "Записано в реестре экспертов GEPARA", "chkRegNo": "В реестре экспертов GEPARA записи нет.", "chkNoOts": "Вы не выбрали доказательство .ots для этого файла. Если оно у вас есть, выберите и его.", "chkErr": "Не удалось связаться с блокчейном. Попробуйте чуть позже.", "howH": "Как это работает", "s1h": "Выберите файл", "s1p": "Файл остаётся на вашем компьютере. Браузер вычисляет его уникальный отпечаток.", "s2h": "Отпечаток записывается", "s2p": "Только отпечаток отправляется на независимые серверы меток времени и закрепляется в блокчейне Bitcoin.", "s3h": "Сохраните доказательство", "s3p": "Храните скачанный файл .ots вместе с оригиналом. Любой сможет проверить его при необходимости.", "faqH": "Вопросы", "q1": "Мой файл загружается в интернет?", "a1": "Нет. Сам файл никуда не отправляется. Отправляется только отпечаток из 64 символов; восстановить по нему содержимое невозможно.", "q2": "Что доказывает доказательство?", "a2": "Что файл существовал в момент записи и что с тех пор в нём не изменилось ни одной буквы. Само по себе оно не доказывает, кому принадлежит файл.", "q3": "Это действует в суде?", "a3": "Это не нотариальное заверение и не квалифицированная юридическая метка времени. Во многих странах его можно представить как доказательство; его значимость оценивает суд. Для бесспорного юридического доказательства используйте квалифицированную метку времени или нотариуса.", "q4": "Что, если я потеряю файл доказательства?", "a4": "Можно записать тот же файл заново, но новое доказательство покажет новую дату. Храните файл .ots вместе с оригиналом.", "q5": "Это бесплатно?", "a5": "Да. Получать и проверять доказательства можно бесплатно. Записи закрепляются в Bitcoin через серверы OpenTimestamps с открытым исходным кодом.", "foot": "«Доказательство файла» — бесплатный сервис проекта GEPARA. Не является юридической консультацией. Записи закрепляются в блокчейне Bitcoin через OpenTimestamps. Контакт: geparatoken@gmail.com", "guidesH": "Руководства (на английском)", "camBtn": "Take a photo and prove it", "orFile": "or choose a file from your computer or phone", "tr1h": "Your file stays with you", "tr1p": "Nothing is uploaded; only a fingerprint is sent.", "tr2h": "Anchored in Bitcoin", "tr2p": "A global record no one can delete or alter.", "tr3h": "Independently verifiable", "tr3p": "No need to trust us; anyone can check at opentimestamps.org.", "tr4h": "Free, no ads", "tr4p": "No account, no card, no personal data.", "liveTxt": "documents recorded on the blockchain", "transp": "Transparency: who, how, which records"}, "ar": {"tabPack": "حزمة التسليم", "packIntro": "اجمع الصور التي تلتقطها عند تسليم شقة أو سيارة أو غرض في حزمة إثبات واحدة. في نزاعات التأمين أو الأضرار، تُظهر أن الصور التُقطت في ذلك اليوم ولم تتغير منذ ذلك الحين.", "dropPack": "اختر صورًا أو التقطها بهاتفك", "dropPackSub": "تبقى الصور على هاتفك؛ تُسجَّل بصماتها الرقمية فقط.", "packNote": "ملاحظة (اختيارية، مثل \"تسليم الشقة 5، 1 نوفمبر\")", "packMake": "إنشاء حزمة الإثبات", "packFiles": "ملفات محددة", "packDone": "الحزمة جاهزة. احتفظ بالملفين مع الصور وشاركهما مع الطرف الآخر.", "packDl1": "تنزيل قائمة الحزمة (.json)", "packDl2": "تنزيل إثبات الحزمة (.ots)", "chkPackOk": "هذه الصورة موجودة في حزمة الإثبات", "chkPackNo": "هذه الصورة ليست في حزمة الإثبات أو تم تغييرها", "chkPackOts": "إثبات الحزمة (.ots) يخص قائمة الحزمة هذه.", "h1": "أثبت أن الملف كان لديك في ذلك التاريخ", "lead": "مجاني. بدون حساب. لا يغادر ملفك جهازك أبدًا؛ تُرسَل بصمته الرقمية فقط إلى خوادم ختم زمني عامة، وتُثبَّت في سلسلة كتل Bitcoin خلال ساعات قليلة.", "tabGet": "احصل على إثبات", "tabCheck": "تحقّق", "dropGet": "أفلت الملفات هنا أو انقر للاختيار", "dropSub": "صور، فيديوهات، عقود، أعمال فنية، رسائل جامعية… أي ملف. يمكنك اختيار عدة ملفات.", "dropCheck": "أفلت الملف المراد التحقق منه وإثباته .ots إن وُجد", "dropCheckSub": "يمكنك تحديد الاثنين معًا.", "fp": "البصمة الرقمية", "working": "جارٍ حساب البصمة الرقمية…", "sending": "جارٍ الإرسال إلى خوادم الختم الزمني…", "done": "الإثبات جاهز. نزّل ملف الإثبات واحتفظ به بجانب الملف الأصلي.", "fail": "تعذّر الوصول إلى الخوادم. تحقّق من اتصالك وحاول مرة أخرى.", "dl": "تنزيل ملف الإثبات (.ots)", "print": "طباعة ورقة الإثبات", "date": "تاريخ التسجيل", "cals": "خوادم قبلته", "chkFile": "الملف", "chkOtsOk": "إثبات .ots هذا يخص هذا الملف.", "chkOtsBad": "إثبات .ots هذا لا يخص هذا الملف. ربما تم تغيير الملف.", "chkOtsMore": "للتحقق من تأكيد Bitcoin بنفسك، افحص الملف وإثباته .ots على opentimestamps.org.", "chkReg": "مسجَّل في سجل خبراء GEPARA", "chkRegNo": "لا يوجد تسجيل في سجل خبراء GEPARA.", "chkNoOts": "لم تحدد إثبات .ots لهذا الملف. إن كان لديك واحد، فحدده أيضًا.", "chkErr": "تعذّر الوصول إلى سلسلة الكتل. حاول مرة أخرى بعد قليل.", "howH": "كيف يعمل", "s1h": "اختر الملف", "s1p": "يبقى ملفك على جهازك. يحسب متصفحك بصمته الرقمية الفريدة.", "s2h": "تُسجَّل البصمة", "s2p": "تُرسَل البصمة الرقمية فقط إلى خوادم ختم زمني مستقلة وتُثبَّت في سلسلة كتل Bitcoin.", "s3h": "احتفظ بالإثبات", "s3p": "احتفظ بملف .ots الذي نزّلته مع الملف الأصلي. يمكن لأي شخص التحقق منه عند الحاجة.", "faqH": "أسئلة", "q1": "هل يُرفَع ملفي؟", "a1": "لا. لا يُرسَل الملف نفسه إلى أي مكان. تُرسَل فقط بصمة من 64 حرفًا، ولا يمكن استعادة المحتوى منها.", "q2": "ماذا يُظهر الإثبات؟", "a2": "أن الملف كان موجودًا عند تثبيت السجل وأنه لم يتغير فيه حرف واحد منذ ذلك الحين. ولا يثبت وحده مَن يملك الملف.", "q3": "هل هو معتمد أمام المحكمة؟", "a3": "ليس توثيقًا لدى كاتب عدل ولا ختمًا زمنيًا قانونيًا مؤهلًا. في كثير من الدول يمكن تقديمه كدليل، والمحكمة هي التي تقرر وزنه. للحصول على إثبات قانوني قاطع، استخدم ختمًا زمنيًا مؤهلًا أو كاتب عدل.", "q4": "ماذا لو فقدت ملف الإثبات؟", "a4": "يمكنك تسجيل الملف نفسه مرة أخرى، لكن الإثبات الجديد سيُظهر التاريخ الجديد. احتفظ بملف .ots مع الملف الأصلي.", "q5": "هل هو مجاني؟", "a5": "نعم. الحصول على الإثباتات والتحقق منها مجاني. تُثبَّت السجلات في Bitcoin عبر خوادم OpenTimestamps مفتوحة المصدر.", "foot": "إثبات الملف خدمة مجانية من مشروع GEPARA. ليس استشارة قانونية. تُثبَّت السجلات في سلسلة كتل Bitcoin عبر OpenTimestamps. للتواصل: geparatoken@gmail.com", "guidesH": "أدلة (بالإنجليزية)", "camBtn": "Take a photo and prove it", "orFile": "or choose a file from your computer or phone", "tr1h": "Your file stays with you", "tr1p": "Nothing is uploaded; only a fingerprint is sent.", "tr2h": "Anchored in Bitcoin", "tr2p": "A global record no one can delete or alter.", "tr3h": "Independently verifiable", "tr3p": "No need to trust us; anyone can check at opentimestamps.org.", "tr4h": "Free, no ads", "tr4p": "No account, no card, no personal data.", "liveTxt": "documents recorded on the blockchain", "transp": "Transparency: who, how, which records"}, "id": {"tabPack": "Paket serah terima", "packIntro": "Gabungkan foto-foto yang Anda ambil saat serah terima rumah, mobil, atau barang ke dalam satu paket bukti. Dalam sengketa uang jaminan atau kerusakan, paket ini menunjukkan bahwa foto diamb const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
async function sha(buf){return new Uint8Array(await crypto.subtle.digest('SHA-256',buf))}
const MAGIC=new Uint8Array([0x00,0x4f,0x70,0x65,0x6e,0x54,0x69,0x6d,0x65,0x73,0x74,0x61,0x6d,0x70,0x73,0x00,0x00,0x50,0x72,0x6f,0x6f,0x66,0x00,0xbf,0x89,0xe2,0xe8,0x84,0xe8,0x92,0x94]);
const CALS=['https://a.pool.opentimestamps.org','https://b.pool.opentimestamps.org','https://a.pool.eternitywall.com'];
function cat(arrs){const n=arrs.reduce((s,a)=>s+a.length,0),o=new Uint8Array(n);let p=0;for(const a of arrs){o.set(a,p);p+=a.length}return o}
async function stamp(d){
  const res=await Promise.all(CALS.map(u=>fetch(u+'/digest',{method:'POST',body:d,headers:{'Accept':'application/vnd.opentimestamps.v1','Content-Type':'application/x-www-form-urlencoded'}})
    .then(r=>r.ok?r.arrayBuffer():null).then(b=>b?new Uint8Array(b):null).catch(()=>null)));
  const ok=res.filter(Boolean);if(!ok.length)return null;
  const parts=[MAGIC,new Uint8Array([0x01,0x08]),d];
  ok.forEach((r,i)=>{if(i<ok.length-1)parts.push(new Uint8Array([0xff]));parts.push(r)});
  return {ots:cat(parts),n:ok.length};
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function getProofs(files){
  for(const f of files){
    const box=document.createElement('div');box.className='item';
    box.innerHTML=`<h3>${esc(f.name)}</h3><div class="hash"></div>`;
    const st=line('wait','working');box.appendChild(st);$('l-al').prepend(box);
    const d=await sha(await f.arrayBuffer());
    box.querySelector('.hash').textContent=t('fp')+': '+hex(d);
    st.dataset.dyn='sending';st.textContent=t('sending');
    const r=await stamp(d);
    if(!r){st.className='st bad';st.dataset.dyn='fail';st.textContent=t('fail');continue}
    const now=new Date();
    st.className='st ok';st.dataset.dyn='done';st.textContent=t('done');
    const meta=document.createElement('div');meta.className='note';meta.textContent=`${t('date')}: ${now.toLocaleString(L)} · ${r.n}/3 ${t('cals')}`;box.appendChild(meta);
    const row=document.createElement('div');row.className='row';
    const a=document.createElement('a');a.className='btn';a.textContent=t('dl');a.dataset.dyn='dl';
    a.href=URL.createObjectURL(new Blob([r.ots],{type:'application/octet-stream'}));a.download=f.name+'.ots';
    a.addEventListener('click',async ev=>{const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;if(dl){ev.preventDefault();try{await dl.save({filename:f.name+'.ots',data:r.ots})}catch(e){}}});
    const pr=document.createElement('button');pr.type='button';pr.className='btn ghost';pr.dataset.dyn='print';pr.textContent=t('print');
    pr.onclick=()=>{document.querySelectorAll('#l-al .item').forEach(x=>x.style.display=x===box?'':'none');tab('al');window.print();document.querySelectorAll('#l-al .item').forEach(x=>x.style.display='')};
    row.append(a,pr);box.appendChild(row);
  }
}

const RPCS=['https://polygon-bor-rpc.publicnode.com','https://polygon.drpc.org','https://polygon-rpc.com'];
const REGS=['0x101036a06cecb95c580515ec027ee20f8e917215','0xc6a4c5ec25f624729ccbdb0fe002e49b38be204b'];
async function rpc(to,data){for(const u of RPCS){try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to,data},'latest']})});const j=await r.json();if(j.result)return j.result}catch(e){}}return null}
async function gepara(h){let reached=false;for(const reg of REGS){const r=await rpc(reg,'0x35e74bbd'+h);if(r===null)continue;reached=true;if(r.length>=194&&BigInt('0x'+r.slice(2,66))===1n){const ts=Number(BigInt('0x'+r.slice(130,194)));return {found:true,date:new Date(ts*1000)}}}return {found:false,reached}}

async function check(files){
  const out=$('l-k');out.innerHTML='';
  const ots=files.filter(f=>f.name.toLowerCase().endsWith('.ots')), plain=files.filter(f=>!f.name.toLowerCase().endsWith('.ots'));
  const otsDigests=[];for(const o of ots){const b=new Uint8Array(await o.arrayBuffer());let okM=b.length>MAGIC.length+34&&MAGIC.every((x,i)=>b[i]===x);if(okM&&b[MAGIC.length+1]===0x08)otsDigests.push({name:o.name,d:hex(b.slice(MAGIC.length+2,MAGIC.length+34))})}
  const mans=[];for(const f of plain.filter(f=>f.name.toLowerCase().endsWith('.json'))){try{const b=new Uint8Array(await f.arrayBuffer());const m=JSON.parse(new TextDecoder().decode(b));if(m.type==='gepara-proof-pack'){const h=hex(await sha(b));mans.push({m,h,name:f.name})}}catch(e){}}
  for(const M of mans){const box=document.createElement('div');box.className='item';box.style.marginTop='14px';box.innerHTML=`<h3>${esc(M.name)}</h3><div class="hash">${t('fp')}: ${M.h}</div><div class="note">${esc(M.m.note||'')} · ${esc(M.m.created||'')}</div>`;
    const r=document.createElement('div');if(otsDigests.find(o=>o.d===M.h)){r.className='res ok';r.innerHTML=`<b>✓ ${esc(t('chkPackOts'))}</b>${esc(t('chkOtsMore'))} <a href="https://opentimestamps.org" target="_blank" rel="noopener">opentimestamps.org</a>`}else if(otsDigests.length){r.className='res bad';r.innerHTML=`<b>✗ ${esc(t('chkOtsBad'))}</b>`}else{r.className='res info';r.textContent=t('chkNoOts')}
    box.appendChild(r);out.appendChild(box)}
  for(const f of plain.filter(f=>!(mans.length&&mans.some(M=>M.name===f.name)))){
    if(mans.length){const h=hex(await sha(await f.arrayBuffer()));const inPack=mans.some(M=>(M.m.files||[]).some(x=>x.sha256===h));
      const box=document.createElement('div');box.className='item';box.style.marginTop='14px';box.innerHTML=`<h3>${esc(f.name)}</h3><div class="hash">${t('fp')}: ${h}</div>`;
      const r=document.createElement('div');r.className='res '+(inPack?'ok':'bad');r.innerHTML=`<b>${inPack?'✓ '+esc(t('chkPackOk')):'✗ '+esc(t('chkPackNo'))}</b>`;box.appendChild(r);out.appendChild(box);continue}
    const box=document.createElement('div');box.className='item';box.style.marginTop='14px';
    const h=hex(await sha(await f.arrayBuffer()));
    box.innerHTML=`<h3>${esc(f.name)}</h3><div class="hash">${t('fp')}: ${h}</div>`;
    const m=otsDigests.find(o=>o.d===h);
    const r1=document.createElement('div');
    if(m){r1.className='res ok';r1.innerHTML=`<b>✓ ${esc(t('chkOtsOk'))}</b>${esc(t('chkOtsMore'))} <a href="https://opentimestamps.org" target="_blank" rel="noopener">opentimestamps.org</a>`}
    else if(otsDigests.length){r1.className='res bad';r1.innerHTML=`<b>✗ ${esc(t('chkOtsBad'))}</b>`}
    else{r1.className='res info';r1.textContent=t('chkNoOts')}
    box.appendChild(r1);
    const r2=document.createElement('div');r2.className='res info';r2.textContent='…';box.appendChild(r2);out.appendChild(box);
    const g=await gepara(h);
    if(g.found){r2.className='res ok';r2.innerHTML=`<b>✓ ${esc(t('chkReg'))}</b>${esc(g.date.toLocaleString(L))}`}
    else r2.textContent=g.reached?t('chkRegNo'):t('chkErr');
  }
}


async function offer(a,name,bytes,type){a.href=URL.createObjectURL(new Blob([bytes],{type}));a.download=name;
  a.addEventListener('click',async ev=>{const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;if(dl){ev.preventDefault();try{await dl.save({filename:name,data:bytes})}catch(e){}}});}

$('p-yap').onclick=async()=>{

  const box=document.createElement('div');box.className='item';const st=line('wait','working');box.appendChild(st);$('l-p').prepend(box);
  const list=[];for(const f of files){list.push({name:f.name,size:f.size,lastModified:new Date(f.lastModified).toISOString(),sha256:hex(await sha(await f.arrayBuffer()))})}
  const man={type:'gepara-proof-pack',version:1,created:new Date().toISOString(),note:$('p-not').value.trim(),files:list};
  const bytes=new TextEncoder().encode(JSON.stringify(man,null,2));const d=await sha(bytes);
  box.insertAdjacentHTML('afterbegin',`<h3>${esc(man.note||('Pack · '+list.length))}</h3><div class="hash">${t('fp')}: ${hex(d)}</div>`);
  st.dataset.dyn='sending';st.textContent=t('sending');

  row.append(a1,a2);box.appendChild(row);

function wire(drop,input,fn){input.onchange=e=>{fn([...e.target.files]);input.value=''};

  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on')}));
